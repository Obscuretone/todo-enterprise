spring:
  datasource:
    url: jdbc:h2:mem:todo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect

  cache:
    type: simple

  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    org.springframework: INFO
    com.example.todo: DEBUG
