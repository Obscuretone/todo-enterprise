spring:
  application:
    name: todo-app

  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:FREEPDB1}
    username: ${DB_USER:appuser}
    password: ${DB_PASSWORD:appuser123}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.OracleDialect
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.springframework: INFO
    com.example.todo: DEBUG
